name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install -e . --no-deps
      - name: Check the built wheel includes the vendored PSL
        run: |
          python -m pip wheel . --no-deps -w "$RUNNER_TEMP/wheel"
          python -m zipfile -l "$RUNNER_TEMP"/wheel/scamshield-*.whl | grep public_suffix_list.dat
          python -m zipfile -l "$RUNNER_TEMP"/wheel/scamshield-*.whl | grep PSL_LICENSE_MPL-2.0.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest
